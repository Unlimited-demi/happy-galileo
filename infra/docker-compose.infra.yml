services:
  # 1. Caddy Reverse Proxy & TLS Ingress
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
      - "127.0.0.1:2019:2019"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./conf.d:/etc/caddy/conf.d
      - /var/log/caddy:/var/log/caddy
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - dev-net

  # 2. Status & Ops Web Dashboard
  dashboard:
    build:
      context: ..
      dockerfile: infra/Dockerfile.dashboard
    image: serverguard-dashboard:latest
    container_name: devctl-dashboard
    restart: unless-stopped
    working_dir: /app
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../.devctl:/app/.devctl
      - ../devctl:/app/devctl
      - ../ai_ops:/app/ai_ops
    environment:
      - BASE_DOMAIN=${BASE_DOMAIN:-dev-server.datakrib.com}
      - CADDY_ADMIN_API=http://caddy:2019
      - DEVCTL_DOCKER_NETWORK=dev-net
      - DEVCTL_STATE_DIR=/app/.devctl
      - DASHBOARD_HOST=0.0.0.0
      - DASHBOARD_PORT=8888
      - NODE_NAME=${NODE_NAME:-Primary Workstation}
      - CENTRAL_HUB_URL=${CENTRAL_HUB_URL:-}
      - FLEET_KEY=${FLEET_KEY:-}
      - BRAIN_URL=${BRAIN_URL:-http://ara-brain:11434}
      - CONCERT_WEBHOOK_URL=${CONCERT_WEBHOOK_URL:-}
      - CONCERT_WEBHOOK_SECRET=${CONCERT_WEBHOOK_SECRET:-}
      - CONCERT_TENANT_ID=${CONCERT_TENANT_ID:-suburban}
      - CONCERT_TEAM_ID=${CONCERT_TEAM_ID:-2f808764-78c2-4235-a40a-3cc57346e9fb}
      - PYTHONPATH=/app
    command: python3 /app/dashboard/app.py
    networks:
      - dev-net

  # 3. AI-Ops Autonomous Monitoring & Escalation Daemon
  ai-ops:
    build:
      context: ..
      dockerfile: infra/Dockerfile.ai-ops
    image: serverguard-ai-ops:latest
    container_name: ai-ops-daemon
    restart: unless-stopped
    working_dir: /app
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../.devctl:/app/.devctl
      - ../devctl:/app/devctl
      - ../ai_ops:/app/ai_ops
    environment:
      - BASE_DOMAIN=${BASE_DOMAIN:-dev-server.datakrib.com}
      - CADDY_ADMIN_API=http://caddy:2019
      - DEVCTL_DOCKER_NETWORK=dev-net
      - DEVCTL_STATE_DIR=/app/.devctl
      - MONITOR_INTERVAL_SECONDS=15
      - AUTO_REMEDIATION_ENABLED=true
      - NODE_NAME=${NODE_NAME:-Primary Workstation}
      - CENTRAL_HUB_URL=${CENTRAL_HUB_URL:-}
      - FLEET_KEY=${FLEET_KEY:-}
      - BRAIN_URL=${BRAIN_URL:-http://ara-brain:11434}
      - CONCERT_WEBHOOK_URL=${CONCERT_WEBHOOK_URL:-}
      - CONCERT_WEBHOOK_SECRET=${CONCERT_WEBHOOK_SECRET:-}
      - CONCERT_TENANT_ID=${CONCERT_TENANT_ID:-suburban}
      - CONCERT_TEAM_ID=${CONCERT_TEAM_ID:-2f808764-78c2-4235-a40a-3cc57346e9fb}
      - PYTHONPATH=/app
    command: python3 /app/ai_ops/daemon.py
    networks:
      - dev-net

  # 4. ARA Local CPU Intelligence Engine (Ollama / Qwen2.5-3B)
  ara-brain:
    image: ollama/ollama:latest
    container_name: ara-brain
    restart: unless-stopped
    cpus: 2.0                 # Hard clamp: never consumes more than 2 CPU cores
    mem_limit: 2500m          # Hard limit: maximum 2.5GB RAM
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_NUM_PARALLEL=1 # Prevents CPU thread thrashing
      - OLLAMA_KEEP_ALIVE=24h # Keeps model resident in memory for instant responses
      - OLLAMA_HOST=0.0.0.0
    networks:
      - dev-net

volumes:
  caddy_data:
  caddy_config:
  ollama_models:

networks:
  dev-net:
    name: dev-net
    external: true
